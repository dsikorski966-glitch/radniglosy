services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dsm_zmien_mnie}
      POSTGRES_DB: dsm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dsm:${DB_PASSWORD:-dsm_zmien_mnie}@db:5432/dsm
      SESSION_SECRET: ${SESSION_SECRET:-zmien-mnie-na-losowy-ciag-32-znakow}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "3000:3000"

  # Wystawienie bez otwierania portów / bez stałego IP.
  # 1) Załóż darmowe konto Cloudflare, dodaj domenę (lub użyj quick tunnel).
  # 2) Wklej token z Zero Trust -> Access -> Tunnels do CLOUDFLARE_TOKEN.
  # Jeśli nie ustawisz tokenu, usługa po prostu nie wystartuje (apka dalej działa w LAN na :3000).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN:-dummy}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN:-dummy}
    depends_on:
      - app
    profiles: ["tunnel"]

volumes:
  pgdata:
